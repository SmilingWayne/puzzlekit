[build-system]
requires = ["setuptools>=77.0", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzlekit"
version = "0.4.0.dev0"
description = "Solve logic puzzles from URLs with the cspuz Rust backend."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SmilingWayne", email = "xiaoxiaowayne@gmail.com"}]
license = "MIT AND LicenseRef-cspuz-bundled"
license-files = ["LICENSE", "LICENSE-cspuz"]
keywords = ["puzzle", "solver", "logic", "cspuz", "puzzlink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["puzzlekit*"]

[[tool.setuptools-rust.ext-modules]]
target = "puzzlekit._cspuz"
path = "rust/Cargo.toml"
binding = "PyO3"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
test-command = "python -m pytest -c {project}/tests/native-pytest.ini --import-mode=importlib {project}/tests/test_nurikabe.py -q"

[project.urls]
Homepage = "https://github.com/SmilingWayne/puzzlekit"
Repository = "https://github.com/SmilingWayne/puzzlekit"
Issues = "https://github.com/SmilingWayne/puzzlekit/issues"

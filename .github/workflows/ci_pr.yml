name: PR CI

on:
  pull_request:
    branches:
      - main
      - v0.4.0-dev
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Custom pzprjs used by pzpr-trace. Bump deliberately, after re-running the
  # state tests against the new revision.
  PZPRJS_REPOSITORY: SmilingWayne/pzprjs-trace
  PZPRJS_REF: d40aeab0b12e723a9ea10ebeece28fc2f6a7fe42

jobs:
  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/reusable_build_test.yml
    with:
      python_version: ${{ matrix.python-version }}
      upload_artifact: false
      build_package: false

  package-build-check:
    name: Package Build Check (Python 3.10)
    uses: ./.github/workflows/reusable_build_test.yml
    with:
      python_version: "3.10"
      upload_artifact: false
      build_package: true

  pzpr-state:
    name: pzpr-trace state (custom pzprjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PZPRJS_REPOSITORY }}
          ref: ${{ env.PZPRJS_REF }}
          path: pzprjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build pzprjs
        working-directory: pzprjs
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install '.[dev]'
      - name: Compare exported states with pzprjs
        env:
          PUZZLEKIT_PZPRJS: ${{ github.workspace }}/pzprjs
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_pzpr_adapters.py | tee pytest.log
          # The integration test skips when Node or pzprjs is missing; here that is a failure.
          if grep -q SKIPPED pytest.log; then echo "pzpr state checks were skipped"; exit 1; fi

  puzzle-table:
    name: Puzzle table is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README.md and docs/PUZZLES.md
        run: python scripts/puzzle_table.py render --check

  uv-install-check:
    name: Install with uv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install .
      - name: Solve a Nurikabe URL
        run: .venv/bin/python -c 'import puzzlekit; assert puzzlekit.solve("https://puzz.link/p?nurikabe/2/2/1i").status == "unique"'

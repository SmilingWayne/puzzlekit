name: PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/reusable_build_test.yml
    with:
      python_version: ${{ matrix.python-version }}
      upload_artifact: false
      build_package: false

  package-build-check:
    name: Package Build Check (Python 3.10)
    uses: ./.github/workflows/reusable_build_test.yml
    with:
      python_version: "3.10"
      upload_artifact: false
      build_package: true

  uv-install-check:
    name: Install with uv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install .
      - name: Solve a Nurikabe URL
        run: .venv/bin/python -c 'import puzzlekit; assert puzzlekit.solve("https://puzz.link/p?nurikabe/2/2/1i").status == "unique"'
